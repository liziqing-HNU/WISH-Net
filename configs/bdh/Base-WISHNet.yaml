# WISH-Net on BDH: the settings every model of the paper shares.  The whole
# 2048 tile, optical and SAR, goes in at 1024 (0.83 m/px) in training and
# evaluation (INPUT.TILE_SCALE 0.5, a default of this code), the outputs mapped back
# to 2048 for the evaluation.  Training: AdamW, base learning rate 1e-4 (the
# optical ResNet-50 at 0.1x), weight decay 0.05 (none on normalisation layers
# and embeddings), full-model gradient clipping at 1.0, batches of two tiles,
# the learning rate lowered tenfold at 20k steps and the run ended at 22k; the
# moving average of the weights (SOLVER.EMA, decay 0.9998) is validated every
# 2000 steps and saved as model_best_h.pth (the weight-selection rule),
# model_best.pth (the lowest Hungarian height MAE) and model_final.pth.
# Paths: DATASETS.BDH_ROOT, DATASETS.BDH_PREPARED and the pretrained weights
# (MODEL.WISHNET.*WEIGHTS) default to datasets/ and pretrained/ in the repository
# (datasets/README.md); set them on the command line otherwise.
MODEL:
  META_ARCHITECTURE: "WISHNet"
  BACKBONE:
    FREEZE_AT: 0
    NAME: "build_resnet_backbone"
  WEIGHTS: ""
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  RESNETS:
    DEPTH: 50
    STEM_TYPE: "basic"
    STEM_OUT_CHANNELS: 64
    STRIDE_IN_1X1: False
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    RES5_MULTI_GRID: [1, 1, 1]
  SEM_SEG_HEAD:
    NAME: "MaskDINOHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 1
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    PIXEL_DECODER_NAME: "MaskDINOEncoder"
    DIM_FEEDFORWARD: 1024
    NUM_FEATURE_LEVELS: 3
    TOTAL_NUM_FEATURE_LEVELS: 3
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
  MaskDINO:
    TRANSFORMER_DECODER_NAME: "WISHDecoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 4.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    BOX_WEIGHT: 5.0
    GIOU_WEIGHT: 2.0
    HIDDEN_DIM: 256
    # a whole tile holds 84 buildings on average, the densest training tile 405
    NUM_OBJECT_QUERIES: 450
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 9
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    INITIAL_PRED: True
    TWO_STAGE: True
    DN: "seg"
    # denoising stays on for tiles up to 200 buildings (groups = DN_NUM // max GT)
    DN_NUM: 200
    INITIALIZE_BOX_TYPE: "bitmask"
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.25
DATASETS:
  TRAIN: ("bdh_train",)
  TEST: ("bdh_val",)
SOLVER:
  IMS_PER_BATCH: 2
  BASE_LR: 0.0001
  STEPS: (20000,)
  MAX_ITER: 22000
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 10
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.1  # the optical ResNet-50 only; the SAR side trains at the base rate
  CHECKPOINT_PERIOD: 4000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 1.0
    NORM_TYPE: 2.0
  AMP:
    ENABLED: False
INPUT:
  FORMAT: "RGB"
TEST:
  EVAL_PERIOD: 2000
  DETECTIONS_PER_IMAGE: 450
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 4
SEED: 3408
CUDNN_BENCHMARK: True
VERSION: 2
